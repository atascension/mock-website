  <line x1="130" y1="55" x2="130" y2="300" stroke="#333" stroke-width="0.5" opacity="0.4"/>
  <line x1="260" y1="55" x2="260" y2="300" stroke="#333" stroke-width="0.5" opacity="0.4"/>
  <!-- Image label -->
  <text x="195" y="248" font-size="9" fill="#888" text-anchor="middle" letter-spacing="2">CAMPAIGN VISUAL</text>
  <!-- Right side text -->
  <text x="430" y="118" font-size="9" fill="#999" letter-spacing="3">NEW ARRIVAL</text>
  <text x="430" y="158" font-size="34" fill="#fff" font-family="Georgia,serif" font-style="italic" font-weight="400">The Autumn</text>
  <text x="430" y="196" font-size="34" fill="#fff" font-family="Georgia,serif" font-style="italic" font-weight="400">Edit 2025</text>
  <text x="430" y="228" font-size="12" fill="#aaa" font-weight="300">Refined pieces for the season ahead.</text>
  <!-- CTA buttons -->
