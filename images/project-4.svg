  <text x="400" y="376" font-size="11" fill="#888" text-anchor="middle" letter-spacing="3">WOMEN'S COLLECTION</text>

  <!-- Product Card 1 -->
  <rect x="30" y="388" width="170" height="185" fill="url(#cardGrad4)" rx="2"/>
  <!-- Product image area -->
  <rect x="30" y="388" width="170" height="135" fill="#ddd4c8" rx="2"/>
  <!-- Clothing shape in card -->
  <path d="M90 405 L80 425 L90 425 L93 480 L137 480 L140 425 L150 425 L140 405 Z" fill="#bbb0a4" opacity="0.8"/>
  <path d="M108 405 L108 396 Q115 390 122 396 L122 405 Z" fill="#b0a498" opacity="0.7"/>
  <!-- Badge -->
  <rect x="38" y="396" width="38" height="16" fill="#1a1a1a" rx="1"/>
  <text x="57" y="407" font-size="7" fill="#fff" text-anchor="middle" letter-spacing="0.5">NEW IN</text>
  <text x="115" y="540" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="500">Linen Blazer</text>
  <text x="115" y="554" font-size="9" fill="#888" text-anchor="middle">Sand / Ecru</text>
  <text x="115" y="568" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="600">$189</text>

  <!-- Product Card 2 -->
  <rect x="215" y="388" width="170" height="185" fill="#ede8e1" rx="2"/>
  <rect x="215" y="388" width="170" height="135" fill="#c8d4d8" rx="2"/>
  <!-- Dress shape -->
  <path d="M278 405 L268 435 Q280 455 300 455 Q320 455 332 435 L322 405 Z" fill="#a8bcc4" opacity="0.8"/>
  <path d="M290 405 L290 396 Q300 388 310 396 L310 405 Z" fill="#9ab0b8" opacity="0.7"/>
  <rect x="223" y="396" width="38" height="16" fill="#c0392b" rx="1"/>
  <text x="242" y="407" font-size="7" fill="#fff" text-anchor="middle" letter-spacing="0.5">SALE</text>
  <text x="300" y="540" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="500">Slip Dress</text>
  <text x="300" y="554" font-size="9" fill="#888" text-anchor="middle">Slate Blue</text>
  <text x="300" y="568" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="600"><tspan fill="#c0392b">$89</tspan><tspan fill="#aaa" font-size="9" font-weight="400" dx="4">$140</tspan></text>

  <!-- Product Card 3 -->
  <rect x="400" y="388" width="170" height="185" fill="#eae3db" rx="2"/>
  <rect x="400" y="388" width="170" height="135" fill="#e0d4c0" rx="2"/>
  <!-- Coat shape -->
  <path d="M455 403 L442 430 L455 430 L458 490 L512 490 L515 430 L528 430 L515 403 Z" fill="#c8b898" opacity="0.8"/>
  <path d="M477 403 L477 394 Q485 386 493 394 L493 403 Z" fill="#bca880" opacity="0.7"/>
  <text x="485" y="540" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="500">Trench Coat</text>
  <text x="485" y="554" font-size="9" fill="#888" text-anchor="middle">Camel / Tan</text>
  <text x="485" y="568" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="600">$345</text>

  <!-- Product Card 4 -->
  <rect x="585" y="388" width="170" height="185" fill="#e8e4e0" rx="2"/>
  <rect x="585" y="388" width="170" height="135" fill="#d8d0c8" rx="2"/>
  <!-- Trousers shape -->
  <rect x="640" y="410" width="40" height="8" fill="#bbb4ac" rx="1"/>
  <path d="M640 418 L635 490 L658 490 L670 453 L682 490 L705 490 L700 418 Z" fill="#b0a8a0" opacity="0.8"/>
  <text x="670" y="540" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="500">Wide Leg Pants</text>
  <text x="670" y="554" font-size="9" fill="#888" text-anchor="middle">Oatmeal</text>
  <text x="670" y="568" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="600">$142</text>
</svg>
