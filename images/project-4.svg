  <text x="494" y="270" font-size="9.5" fill="#1a1a1a" text-anchor="middle" letter-spacing="1.5" font-weight="600">SHOP NOW</text>
  <rect x="568" y="248" width="128" height="34" fill="none" stroke="#666" stroke-width="1"/>
  <text x="632" y="270" font-size="9.5" fill="#ccc" text-anchor="middle" letter-spacing="1.5">LOOKBOOK</text>

  <!-- ── CATEGORY STRIP ── -->
  <rect y="300" width="800" height="46" fill="#fff"/>
  <rect y="300" width="800" height="1" fill="#ececec"/>
  <rect y="345" width="800" height="1" fill="#ececec"/>
  <text x="108" y="328" font-size="9.5" fill="#1a1a1a" text-anchor="middle" letter-spacing="2" font-weight="600">WOMEN</text>
  <text x="242" y="328" font-size="9.5" fill="#888" text-anchor="middle" letter-spacing="2">MEN</text>
  <text x="376" y="328" font-size="9.5" fill="#888" text-anchor="middle" letter-spacing="2">ACCESSORIES</text>
  <text x="510" y="328" font-size="9.5" fill="#888" text-anchor="middle" letter-spacing="2">SALE</text>
  <text x="638" y="328" font-size="9.5" fill="#888" text-anchor="middle" letter-spacing="2">NEW IN</text>
  <!-- Active underline -->
  <rect x="74" y="343" width="68" height="2" fill="#1a1a1a"/>

