<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="heroGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ebe4"/>
      <stop offset="100%" style="stop-color:#e2d9ce"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="800" height="600" fill="#fafafa"/>

  <!-- ── NAV BAR ── -->
  <rect width="800" height="54" fill="#fff"/>
  <rect y="54" width="800" height="1" fill="#ececec"/>
  <!-- Hamburger / menu icon left -->
  <rect x="28" y="21" width="20" height="2" fill="#1a1a1a"/>
  <rect x="28" y="27" width="14" height="2" fill="#1a1a1a"/>
  <rect x="28" y="33" width="20" height="2" fill="#1a1a1a"/>
  <!-- Logo centred -->
  <text x="400" y="34" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="6" font-family="Georgia,serif">ÉLAN</text>
  <!-- Icons right -->
  <!-- Search icon -->
  <circle cx="726" cy="27" r="7" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="731" y1="32" x2="736" y2="37" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cart icon -->
  <rect x="749" y="20" width="14" height="12" rx="1" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M752 20 Q752 16 756 16 Q760 16 760 20" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Cart badge -->
  <circle cx="763" cy="18" r="5" fill="#c0392b"/>
  <text x="763" y="21" font-size="6" fill="#fff" text-anchor="middle" font-weight="700">2</text>

  <!-- ── HERO SECTION ── -->
  <rect y="55" width="800" height="245" fill="url(#heroGrad4)"/>
  <!-- Large product image placeholder - left side -->
  <rect x="0" y="55" width="390" height="245" fill="#2a2a2a"/>
  <!-- Clothing silhouette shape -->
  <rect x="145" y="90" width="100" height="8" rx="2" fill="#3d3d3d"/>
  <path d="M155 98 L145 130 L160 130 L165 210 L225 210 L230 130 L245 130 L235 98 Z" fill="#454545"/>
  <path d="M185 98 L185 88 Q195 80 205 88 L205 98 Z" fill="#3a3a3a"/>
