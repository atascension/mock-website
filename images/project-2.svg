<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1f"/>
      <stop offset="100%" style="stop-color:#0d1a35"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8040ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff40aa;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055ee"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8040ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8040ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Ambient glow orbs -->
  <ellipse cx="200" cy="250" rx="280" ry="200" fill="url(#orb1)" opacity="0.6"/>
  <ellipse cx="620" cy="350" rx="240" ry="180" fill="url(#orb2)" opacity="0.5"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#4488ff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- ── NAV ── -->
  <rect width="800" height="50" fill="#060d1f" opacity="0.9"/>
  <rect y="50" width="800" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- Logo: wordmark -->
  <text x="28" y="31" font-size="16" fill="#fff" font-family="Arial,sans-serif" font-weight="700" letter-spacing="-0.5">nexus</text>
  <text x="80" y="31" font-size="16" fill="#0099ff" font-family="Arial,sans-serif" font-weight="700">ai</text>
  <!-- Logo dot -->
  <circle cx="102" cy="21" r="3" fill="#0099ff" filter="url(#glow)"/>

  <!-- Nav links -->
  <text x="480" y="29" font-size="10" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">PRODUCT</text>
  <text x="545" y="29" font-size="10" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">PRICING</text>
  <text x="610" y="29" font-size="10" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">DOCS</text>
  <rect x="665" y="16" width="110" height="24" fill="url(#btnGrad)" rx="12"/>
  <text x="720" y="32" font-size="10" fill="#fff" text-anchor="middle" font-weight="600" letter-spacing="0.8">START FREE →</text>

  <!-- ── HERO ── -->
  <!-- Badge -->
  <rect x="280" y="75" width="242" height="22" fill="rgba(0,102,255,0.12)" rx="11" stroke="#0066ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="295" cy="86" r="4" fill="#0099ff"/>
  <text x="308" y="90" font-size="9.5" fill="#60aaff" letter-spacing="0.8">Now in public beta — free forever plan</text>

  <!-- Main headline -->
  <text x="400" y="150" font-size="48" fill="#fff" font-family="Arial,sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-1.5">Ship faster with</text>
  <text x="400" y="205" font-size="48" font-family="Arial,sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-1.5">
    <tspan fill="#4488ff">AI</tspan>
    <tspan fill="#fff"> that learns</tspan>
  </text>
  <text x="400" y="260" font-size="48" fill="#fff" font-family="Arial,sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-1.5">your codebase.</text>

  <!-- Subline -->
  <text x="400" y="298" font-size="13.5" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="300" letter-spacing="0.2">Nexus analyzes your repo, writes tests, spots bugs, and suggests</text>
  <text x="400" y="316" font-size="13.5" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="300" letter-spacing="0.2">refactors — right inside your editor.</text>

  <!-- CTAs -->
  <rect x="236" y="335" width="160" height="42" fill="url(#btnGrad)" rx="4"/>
  <text x="316" y="361" font-size="11" fill="#fff" text-anchor="middle" font-weight="600" letter-spacing="0.8">GET STARTED FREE</text>

  <rect x="408" y="335" width="160" height="42" fill="rgba(255,255,255,0.06)" rx="4" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="488" y="361" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="500" letter-spacing="0.8">WATCH DEMO ▶</text>

  <!-- Social proof -->
  <text x="400" y="402" font-size="10.5" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="0.5">Trusted by 12,000+ developers at</text>
  <text x="175" y="420" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700" letter-spacing="2">STRIPE</text>
  <text x="285" y="420" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700" letter-spacing="2">VERCEL</text>
  <text x="383" y="420" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700" letter-spacing="2">LINEAR</text>
  <text x="490" y="420" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700" letter-spacing="2">SUPABASE</text>
  <text x="596" y="420" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700" letter-spacing="2">LOOM</text>

  <!-- ── FEATURE CARDS ── -->
  <rect x="40" y="445" width="222" height="120" fill="url(#cardGrad)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Icon -->
  <rect x="58" y="461" width="28" height="28" fill="rgba(0,102,255,0.2)" rx="6"/>
  <text x="72" y="480" font-size="15" text-anchor="middle">⚡</text>
  <text x="58" y="505" font-size="11" fill="#fff" font-weight="600">Auto-complete &amp; Fix</text>
  <text x="58" y="520" font-size="10" fill="rgba(255,255,255,0.45)" xml:space="preserve">Context-aware suggestions</text>
  <text x="58" y="534" font-size="10" fill="rgba(255,255,255,0.45)">that understand your stack.</text>
  <!-- Accent line -->
  <rect x="40" y="445" width="222" height="2" fill="url(#btnGrad)" rx="1" opacity="0.7"/>

  <rect x="289" y="445" width="222" height="120" fill="url(#cardGrad)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="307" y="461" width="28" height="28" fill="rgba(128,64,255,0.2)" rx="6"/>
  <text x="321" y="480" font-size="15" text-anchor="middle">🧪</text>
  <text x="307" y="505" font-size="11" fill="#fff" font-weight="600">One-click Tests</text>
  <text x="307" y="520" font-size="10" fill="rgba(255,255,255,0.45)">Generate full test suites</text>
  <text x="307" y="534" font-size="10" fill="rgba(255,255,255,0.45)">for any function instantly.</text>
  <rect x="289" y="445" width="222" height="2" fill="#8040ff" rx="1" opacity="0.7"/>

  <rect x="538" y="445" width="222" height="120" fill="url(#cardGrad)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="556" y="461" width="28" height="28" fill="rgba(0,200,150,0.2)" rx="6"/>
  <text x="570" y="480" font-size="15" text-anchor="middle">🔍</text>
  <text x="556" y="505" font-size="11" fill="#fff" font-weight="600">Bug Detection</text>
  <text x="556" y="520" font-size="10" fill="rgba(255,255,255,0.45)">Spots issues before they</text>
  <text x="556" y="534" font-size="10" fill="rgba(255,255,255,0.45)">reach production.</text>
  <rect x="538" y="445" width="222" height="2" fill="#00c896" rx="1" opacity="0.7"/>
</svg>
